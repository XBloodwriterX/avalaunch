[package]
name = "avalaunch"
version = "0.1.0"
description = "Turn any webpage into a native desktop app with built-in ad blocking and privacy protection"
authors = ["Avalaunch Team"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "avalaunch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.10.2", default-features = false, features = ["wry"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-opener = "2.5.3"
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-global-shortcut = "2.3.1"
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.49.0", features = ["full"] }
thiserror = "2.0"
dirs = "6.0"
directories = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
